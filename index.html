  try{const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const [fa,au,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=fa.initializeApp(FB_CONFIG);

    if(APPCHECK_KEY){try{const ac=await import(B+'firebase-app-check.js');ac.initializeAppCheck(app,{provider:new ac.ReCaptchaV3Provider(APPCHECK_KEY),isTokenAutoRefreshEnabled:true})}catch(e){console.warn('app check',e)}}
    const auth=au.getAuth(app),db=fs.getFirestore(app);
    let RD=null,rtT=null;const rtdb=async()=>{if(!RD){const rd=await import(B+'firebase-database.js');RD={rd,db:rd.getDatabase(app,RTDB_URL)}}return RD};
    const rtIdle=()=>{clearTimeout(rtT);rtT=setTimeout(()=>{if(RD&&!CHT.unsub)RD.rd.goOffline(RD.db)},8000)};
    const rt=async f=>{const x=await rtdb();clearTimeout(rtT);x.rd.goOnline(x.db);try{return await f(x.rd,x.db)}finally{rtIdle()}};
    CL.api={
      signIn:async()=>{const pv=new au.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
        try{await au.signInWithPopup(auth,pv)}catch(e){const c=e&&e.code||'';
          if(/popup-blocked|operation-not-supported|web-storage-unsupported/.test(c))await au.signInWithRedirect(auth,pv);
          else if(/popup-closed/.test(c))return 'closed';else if(!/cancelled-popup/.test(c))throw e}},
      signOut:()=>au.signOut(auth),
      // saves + leaderboard live in Realtime Database (no daily write cap); old Firestore copies are only read as a one-time fallback
      get:async uid=>{const v=await rt((rd,r)=>rd.get(rd.ref(r,'saves/'+uid)).then(s=>s.val()));if(v)return v;
        const d=await fs.getDoc(fs.doc(db,'saves',uid));return d.exists()?d.data():null},
      put:(uid,d)=>rt((rd,r)=>{const o={at:+d.at||Date.now()};if(d.game)o.game=d.game;if(d.rec)o.rec=d.rec;return rd.set(rd.ref(r,'saves/'+uid),o)}),
      top:async(f,dir,n)=>{const asc=dir==='asc';
        const rows=await rt((rd,r)=>rd.get(rd.query(rd.ref(r,'lb'),rd.orderByChild(f),...(asc?[rd.startAt(1),rd.limitToFirst(n)]:[rd.limitToLast(n)]))).then(s=>{const a=[];s.forEach(c=>{a.push(Object.assign({uid:c.key},c.val()))});return a}));
        const all=rows.filter(x=>typeof x[f]==='number'&&(!asc||x[f]>0));
        return all.sort((a,b)=>asc?a[f]-b[f]:b[f]-a[f]).slice(0,n)},

const SLKEY='izakaya-slots-v1';
function slLoad(){try{const o=JSON.parse(localStorage.getItem(SLKEY));return {s:Array.isArray(o&&o.s)?o.s.slice(0,3):[],b:Array.isArray(o&&o.b)?o.b.slice(0,3):[]}}catch(e){return {s:[],b:[]}}}
function slSave(o){try{localStorage.setItem(SLKEY,JSON.stringify(o));return true}catch(e){return false}}
function slOK(g){try{const o=JSON.parse(g);return !!o&&typeof o.day==='number'}catch(e){return false}}
function slBackup(g,why){if(TEST||!g||!slOK(g)||g===JSON.stringify(fresh()))return;const o=slLoad();if(o.b.some(x=>x&&x.game===g))return;o.b.unshift({at:Date.now(),game:g,why});o.b=o.b.slice(0,3);slSave(o)}

  // stores bought before the leaderboard existed never recorded a buy day; fill it in once from the save's current day (an upper bound, so it can't overstate speed)
  if(!r.ownDay){let g=null;try{g=JSON.parse(lsGet(KEY)||'null')}catch(e){}if(g&&g.owned&&g.day>0){r.owned=true;r.ownDay=g.day;saveRec(r)}}
  if(!r.nick)return null;const d={name:r.nick,best:Math.max(0,Math.round(r.bestDay||0)),earned:Math.max(0,Math.round(r.earned||0))};if(r.ownDay)d.own=r.ownDay;if(r.maxDay>0)d.days=Math.round(r.maxDay);return d}
async function lbPush(u){const d=lbEntry();if(!d||!CL.api.putLb)return;{let g=null;try{g=JSON.parse(lsGet(KEY)||'null')}catch(e){}if(g&&g.cheat)return} /* a save touched by the author test tools never goes on the leaderboard */
  const k=JSON.stringify(d);if(LB.last===u.uid+k)return;
  try{await CL.api.putLb(u.uid,Object.assign({at:Date.now()},d))}
  catch(e){if(!d.days)throw e;const d2=Object.assign({},d);delete d2.days;await CL.api.putLb(u.uid,Object.assign({at:Date.now()},d2))} /* rules not updated yet: still keep the rest of the entry */
  LB.last=u.uid+k;LB.cache={}}

/* ===== friends: add by code, ranking among friends, visit a friend's shop, one gift per friend per day (all Realtime Database) =====
   fcode/<CODE>=uid · friends/<me>/<friend>=t · freq/<friend>/<me>=t (pending add, accepted when the friend opens this tab)
   gifts/<to>/<from>={t,a,d} · gclaim/<me>/<from>=d · lbx/<uid> = public snapshot of a player's shop (shown when visited) */
const FR_MAX=20,FR_GIFT=1000,FR={sort:'best',reg:null,data:null,t:0,view:'list',dirty:0};
function fcodeOf(uid){const A='23456789ABCDEFGHJKMNPQRSTUVWXYZ';let a=0x811c9dc5|0,b=0x9747b28c|0;for(let i=0;i<uid.length;i++){const c=uid.charCodeAt(i);a=Math.imul(a^c,16777619);b=Math.imul(b^c,0x5bd1e995);b^=b>>>15}let s='';for(const h of [a,b]){let v=h>>>0;for(let i=0;i<4;i++){s+=A[v%31];v=Math.floor(v/31)}}return s}
const fmtCode=c=>c.slice(0,4)+'-'+c.slice(4),frDay=()=>Math.floor((Date.now()+288e5)/864e5);
/* shop rating: average stars over the last 7 days played (0–3 each), needs at least 3 days; rt is what friends see */
const RT=[[2.5,5,'五星評價','客人排隊排到巷口，老闆娘忙到沒時間喝水！','夯爆了'],[2,4,'四星評價','常客多、口碑穩，偶爾還是有人嫌醬油太鹹。','頂級'],[1.5,3,'三星評價','還行啦，客人吃得飽，但不會特地再來。','人上人'],[1,2,'普通','客人留言：菜單看起來不錯，但上菜好慢喔。','npc'],[0,1,'差評','拉完了，跟💩一樣好吃👍','']];
function shopRate(g){const ks=Object.keys(g.stars||{}).map(Number).sort((a,b)=>a-b);if(ks.length<3)return null;const last=ks.slice(-7);const avg=last.reduce((s,k)=>s+(g.stars[k]||0),0)/last.length;const t=RT.find(x=>avg>=x[0]);return t?{rt:t[1],avg:Math.round(avg*10)/10}:null}
const rtTag=rt=>{const t=RT.find(x=>x[1]===rt);return t?` <small class="rtag r${rt}">${T(t[2])}</small>`:''};
const rtFull=rt=>{const t=RT.find(x=>x[1]===rt);return t?`${T(t[2])}<br><small>${T(t[3])}${t[4]?` <b>${T(t[4])}</b>`:''}</small>`:T('還沒評價（至少營業 3 天）')};
function lbxEntry(){const d=lbEntry();if(!d)return null;let g=null;try{g=JSON.parse(lsGet(KEY)||'null')}catch(e){}if(!g)return null;
  delete d.days;d.day=Math.max(1,(g.day||1)+(g.pendingNext?1:0));d.ya=g.rm?1:0;d.k2=g.rm&&g.rm.k2?1:0;let c=0;for(const k in(g.dec||{}))if(g.dec[k])c++;if(g.rm&&g.rm.dec)for(const k in g.rm.dec)if(g.rm.dec[k])c++;d.dc=c;const sr=shopRate(g);if(sr)d.rt=sr.rt;return d}
async function lbxPush(u){try{if(!CL.api.putLbx)return;let g=null;try{g=JSON.parse(lsGet(KEY)||'null')}catch(e){}if(g&&g.cheat)return;const d=lbxEntry();if(!d)return;

  LB.lastx=u.uid+k}catch(e){console.warn('lbx',e)}}
async function frLoad(){const me=CL.user,a=CL.api,uid=me.uid;
  if(FR.reg!==uid){await a.regCode(uid,fcodeOf(uid));FR.reg=uid}
  const [fl,rq]=await Promise.all([a.frList(uid),a.frReq(uid)]);const rm=loadRec().frRm||{};
  const add=Object.keys(rq).filter(k=>k!==uid&&!fl[k]&&!rm[k]).slice(0,Math.max(0,FR_MAX-Object.keys(fl).length));
  if(add.length){await a.frAcc(uid,add);add.forEach(k=>{fl[k]=1})}
  const ids=Object.keys(fl);const [lbs,gifts,cl]=await Promise.all([ids.length?a.lbxMany(ids):{},a.giftList(uid),a.gclaimGet(uid)]);
  const pend=Object.keys(gifts).filter(f=>fl[f]&&(gifts[f].d||0)>(cl[f]||0));
  FR.data={fl,lbs,gifts,pend};FR.t=Date.now();return FR.data}

const NOTICES=[NOTICE_DAYS,NOTICE_FR,NOTICE_ART,NOTICE_TRACK,NOTICE_K2,NOTICE_RMX,NOTICE_AOI,NOTICE_GUN,NOTICE_NEW,NOTICE_OLD],NOTICE_BUILTIN=NOTICES[0];
let NOTICE_REMOTE=false,NOTICE_HIST={},NOTICE_DEL={},NOTICE_LOADED=false,NSHOW=null,NAUTO=false,NAUTOREQ=false;
/* deleted announcements: a built-in one cannot be removed from the code, so deleting it leaves a marker in the database (notice/del/<key>);
   the markers are also kept on this device so a deleted built-in notice does not flash up before the database answers */
try{NOTICE_DEL=JSON.parse(localStorage.getItem('izakaya-notice-del')||'{}')||{}}catch(e){}
function nkey(id){return String(id).replace(/[.#$\[\]\/]/g,'_')}
let NOTICE=noticeAll()[0]||null;
/* every announcement = the built-in ones above + the ones posted in-game (Realtime Database notice/hist/<id>).
   An in-game entry with the same id as a built-in one overrides it (that is how a built-in one gets edited). */
function noticeAt(x){return x.at?Date.parse(x.at):noticeTime(x.id)}
function noticeAll(){const m=new Map();NOTICES.forEach(x=>m.set(x.id,x));
  Object.keys(NOTICE_HIST).forEach(k=>{const h=NOTICE_HIST[k];m.set(h.id,Object.assign({},m.get(h.id)||{},h,{rem:true}))});
  return [...m.values()].filter(x=>!NOTICE_DEL[nkey(x.id)]).sort((a,b)=>noticeAt(b)-noticeAt(a))}
function noticeDate(x){const t=noticeAt(x);if(!t)return'';const s=new Date(t+288e5).toISOString();return x.at||/^\d{4}-\d\d-\d\dT/.test(String(x.id))?s.slice(0,10)+' '+s.slice(11,16):s.slice(0,10)}
function noticeSeenId(){try{return localStorage.getItem('izakaya-notice')}catch(e){return null}}
function noticeSeen(id){try{localStorage.setItem('izakaya-notice',id||NOTICE.id)}catch(e){}}
/* The auto pop-up must not run ahead of the database: the built-in newest one used to pop up before the posted ones arrived, and 知道了 then marked the (newer) posted one as read without ever showing it.
   So: wait for the database (3.5s at most), mark only the notice that was really shown, and if a newer one is still due afterwards, show it next. */
function noticePop(){NOTICE_LOADED=true;if(!HOME||R)return;
  if(!document.querySelector('#homeModal .modal')){if(noticeDue()){NAUTOREQ=true;showNotice()}}
  else if(NAUTO&&NSHOW!=null&&NOTICE&&String(NSHOW)!==String(NOTICE.id)&&document.querySelector('#homeModal .notice')){NAUTOREQ=true;showNotice()}}
function noticeDue(){const sid=noticeSeenId();return !!NOTICE&&NOTICE.id&&sid!==NOTICE.id&&!(sid&&NOTICE_DEL[nkey(sid)])}
/* announcement reactions: noticevote/<id>/<uid> = 0 (seen) | 1 (like) | -1 (dislike). Only signed-in players are counted; only the author can read the totals (see database.rules.json). */
let NV={id:null,v:null,st:null};
async function noticeVoteInit(n){NV={id:String(n.id),v:null,st:null};noticeVoteDraw();if(!CL.api||!CL.user)return;
  const id=NV.id,u=CL.user.uid;
  try{let v=await CL.api.noticeVoteGet(id,u);if(NV.id!==id)return;
    if(v==null){v=0;CL.api.noticeVoteSet(id,u,0).then(()=>{if(isAdmin()&&NV.id===id)noticeVoteStat()}).catch(()=>{})}
    NV.v=v;noticeVoteDraw();if(isAdmin())noticeVoteStat()}catch(e){}}
async function noticeVoteStat(){const id=NV.id;try{const st=await CL.api.noticeVoteAll(id);if(NV.id===id){NV.st=st;noticeVoteDraw()}}catch(e){}}
function noticeVoteDraw(){const b=$('nvbox');if(!b)return;const on=!!CL.user&&NV.v!=null;
  const btn=(val,ic)=>`<button class="btn alt nvb${NV.v===val?' on':''}" data-act="noticevote" data-v="${val}"${on?'':' disabled'}>${ic}</button>`;
  const st=NV.st,pc=x=>st&&st.seen?Math.round(x*100/st.seen)+'%':'0%';
  b.innerHTML=`<div class="nvrow">${btn(1,'👍')}${btn(-1,'👎')}</div>`+(CL.user?'':`<p class="nvhint">${T('登入後才能按讚，也才會算進看過人數')}</p>`)+(isAdmin()&&st?`<p class="nvstat">👁 看過 ${st.seen}　👍 ${st.up}（${pc(st.up)}）　👎 ${st.down}（${pc(st.down)}）</p><p class="nvhint">只計入有登入的玩家</p>`:'')}
async function noticeVote(val){if(!CL.user||!CL.api||NV.v==null||!NV.id)return;const id=NV.id,old=NV.v,nv=old===val?0:val;
  NV.v=nv;noticeVoteDraw();
  try{await CL.api.noticeVoteSet(id,CL.user.uid,nv);if(isAdmin())noticeVoteStat()}catch(e){if(NV.id===id){NV.v=old;noticeVoteDraw()}toast('送出失敗，晚點再試')}}
function showNotice(again,id){const au=NAUTOREQ;NAUTOREQ=false;const all=noticeAll(),old=id!=null,n=old?all.find(x=>x.id===String(id)):NOTICE;if(!n){closeModal();return}const rem=!!n.rem;NSHOW=String(n.id);NAUTO=au&&!old;if(NAUTO)noticeSeen(NSHOW);
  const text=rem?n.text:T(n.text),sign=rem?(n.sign||''):T(n.sign),dt=noticeDate(n);
  modal(`<div class="notice"><h2>📢 ${rem?(n.title?esc(n.title):T('公告')):T(n.title)}</h2>${dt?`<p style="font-size:12px;opacity:.7;margin-top:-6px">${dt}${n.edited?' · 已編輯':''}</p>`:''}<p>${esc(text)}</p>${sign?`<p class="sign">${esc(sign)}</p>`:''}<div class="nvbox" id="nvbox"></div></div>
  <div class="btns"><button class="btn" data-act="noticeok">${T('知道了')}</button>${all.length>1?`<button class="btn alt" data-act="noticelist">📜 ${T('之前的公告')}</button>`:''}${FB_CONFIG?`<button class="btn alt" data-act="fb">${T('意見反應')}</button>`:''}${canPost()?`<button class="btn alt" data-act="noticenew">📢 發布</button>`:''}${canPost()?`<button class="btn alt" data-act="noticeedit" data-id="${esc(n.id)}">✏️ 編輯</button>`:''}${canDelNotice()?`<button class="btn alt" data-act="noticedel" data-id="${esc(n.id)}">🗑️ 刪除</button>`:''}</div>`);noticeVoteInit(n)}
/* the "past announcements" screen: every announcement, newest first, in a box that scrolls so it never takes over the screen */
function noticeList(){const all=noticeAll(),adm=canPost();
  modal(`<h2>📜 ${T('之前的公告')}（${all.length}）</h2>
  <div style="max-height:58vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:6px 0">${all.map(x=>`<div style="display:flex;gap:6px"><button class="btn alt" style="flex:1;text-align:left;font-size:14px;padding:6px 12px" data-act="noticeold" data-id="${esc(x.id)}"><small style="opacity:.7">${noticeDate(x)}</small><br>${x.rem?esc(x.title||T('公告')):T(x.title)}</button>${adm?`<button class="btn alt" style="font-size:14px;padding:6px 10px" data-act="noticeedit" data-id="${esc(x.id)}">✏️</button>`:''}${canDelNotice()?`<button class="btn alt" style="font-size:14px;padding:6px 10px" data-act="noticedel" data-id="${esc(x.id)}">🗑️</button>`:''}</div>`).join('')}</div>
  <div class="btns"><button class="btn alt" data-act="notice">${T('返回')}</button></div>`)}
function noticeEdit(id){const n=noticeAll().find(x=>x.id===String(id));if(!n||!canPost())return;
  modal(`<h2>✏️ 編輯公告</h2><p style="font-size:14px">改的是已經發出去的這則：玩家不會再被跳一次提示，下次打開遊戲或翻歷史公告時就會看到新內容（只顯示中文原文，不會自動翻譯）。${n.rem?'':'這則是內建公告，儲存後會用線上版本蓋過去。'}</p>
  <input class="nickin" id="etitle" maxlength="40" style="font-size:16px;padding:7px 10px" placeholder="標題" value="${esc(n.title||'')}" autocomplete="off">
  <textarea class="fbtext" id="etext" maxlength="2000" placeholder="公告內容">${esc(n.text||'')}</textarea>
  <input class="nickin" id="esign" maxlength="40" style="font-size:16px;padding:7px 10px" placeholder="署名" value="${esc(n.sign||'')}" autocomplete="off">
  <div class="btns"><button class="btn" data-act="noticeeditsave" data-id="${esc(n.id)}">儲存</button><button class="btn alt" data-act="noticelist">返回</button></div>`)}
async function noticeEditSave(id){const n=noticeAll().find(x=>x.id===String(id)),ti=$('etitle'),tx=$('etext'),sg=$('esign');if(!n||!tx||!canPost())return;
  const text=tx.value.trim();if(text.length<2){toast('公告內容太短了');return}
  const d={id:n.id,title:ti.value.trim(),text,sign:sg.value.trim(),edited:Date.now()};if(n.at)d.at=n.at;
  try{await CL.api.editNotice(d,n.id===NOTICE.id);NOTICE_HIST[n.id]=d;NOTICE=noticeAll()[0];NOTICE_REMOTE=!!NOTICE.rem;logAct('編輯公告',n.id,{title:String(d.title||'').slice(0,40)});toast('公告已更新 ✏️');showNotice(true,n.id)}catch(e){toast('儲存失敗：'+String(e&&e.code||e))}}
async function noticeDelete(id){const n=noticeAll().find(x=>x.id===String(id));if(!n||!canDelNotice())return;
  if(!confirm('確定刪除這則公告？\n「'+(n.title||'公告')+'」\n刪除後所有玩家都看不到，無法復原。'))return;
  const builtin=NOTICES.some(x=>x.id===n.id),next=noticeAll().filter(x=>x.rem&&x.id!==n.id)[0]||null;
  try{await CL.api.delNotice(n.id,builtin,next);logAct('刪除公告',n.id,{title:String(n.title||'').slice(0,40)});
    delete NOTICE_HIST[n.id];if(builtin){NOTICE_DEL[nkey(n.id)]=true;try{localStorage.setItem('izakaya-notice-del',JSON.stringify(NOTICE_DEL))}catch(e){}}
    NOTICE=noticeAll()[0]||null;NOTICE_REMOTE=!!(NOTICE&&NOTICE.rem);toast('公告已刪除 🗑️');
    if(noticeAll().length)noticeList();else closeModal()}catch(e){toast('刪除失敗：'+String(e&&e.code||e))}}
/* in-game notices use a UTC timestamp id ('2026-10-22T18:31'); built-in ones use a Taiwan date ('2026-10-23-aoi').
   Compare real times, not strings, or a notice posted after midnight in Taiwan looks 'older' than that day's built-in one.
   Give each new built-in notice an 'at' (its real release time), or any in-game notice from earlier that same day hides it. */

  <div class="tstr"><b>事件</b><select id="tstev">${TEVS.map(([k,n])=>`<option value="${k}" ${(f.ev||'')===k?'selected':''}>${n}</option>`).join('')}</select>
    <select id="tstrob"><option value="" ${!f.rob?'selected':''}>搶劫：隨機</option><option value="on" ${f.rob==='on'?'selected':''}>搶劫：一定來</option><option value="off" ${f.rob==='off'?'selected':''}>搶劫：不要</option></select>
    <select id="tstcust"><option value="" ${f.cust!=='none'?'selected':''}>客人：照常</option><option value="none" ${f.cust==='none'?'selected':''}>客人：無</option></select>
    <select id="tstbare"><option value="" ${!f.bare?'selected':''}>檯面：照常</option><option value="1" ${f.bare?'selected':''}>檯面：全空</option></select><button class="btn" data-act="tstev">套用</button></div>
  <p class="tsth">事件設定會套用到之後每一天，直到你改回「隨機」。</p>
  <div class="tstr"><b>拉麵店</b>${o&&o.rm?`<button class="btn alt" disabled>屋台已開張</button>`:`<button class="btn" data-act="tstrm">買店面＋開屋台</button>`}${o&&o.rm&&!o.rm.k2?`<button class="btn" data-act="tstk2">擴建二號廚房</button>`:''}<span style="font-size:13px">${!o?'':o.rm?(o.rm.k2?'屋台＋二號廚房都有了':'已有屋台，還沒擴建'):o.owned?'已買店面，還沒開屋台':'還沒買店面'}・不扣錢</span></div>
  <div class="tstr"><b>屋台炸物</b><button class="btn alt" data-act="tstfried">賣出 +50</button><span style="font-size:13px">${o&&o.rm?`目前 ${o.rm.fried||0} 份`:'還沒開屋台'}</span></div>
  <div class="tstr"><b>壽司店開發</b>${isAdmin()?`<button class="btn ${sushiDev()?'':'alt'}" data-act="tstsushi">${sushiDev()?'顯示中（點了隱藏）':'已隱藏（點了顯示）'}</button>`:''}</div>
  <div class="tstr"><b>營業速度</b>${[1,2,4].map(n=>`<button class="btn ${TSPD===n?'':'alt'}" data-act="tstspd" data-id="${n}">${n}x</button>`).join('')}</div>
  </div><div class="btns">${TEST?`<button class="btn alt" data-act="tstreset">清空測試存檔</button><button class="btn alt" data-act="tstoff">離開測試模式</button>`:`<button class="btn alt" data-act="tstcopy">另開獨立測試存檔</button>`}<button class="btn" data-act="closem">關閉</button></div>`)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act^="tst"]');if(!a)return;const act=a.dataset.act;
  if(!TEST&&!isAdmin())return;
  if(act==='tstpanel'){if(!HOME){toast('回到主畫面再開測試面板');return}tstPanel()}
  else if(act==='tston')tstSet(true,false);
  else if(act==='tstcopy'){if(CL.pick){toast('先選好要用哪份存檔');return}tstSet(true,true)}
  else if(act==='tstoff')tstSet(false);
  else if(act==='tstday'){const d=Math.max(1,Math.min(999,parseInt($('tstday').value)||1));tstEdit(o=>{o.day=d;o.pendingNext=false;o.today=null})}
  else if(act==='tstsushi'){if(!isAdmin())return;try{if(sushiDev())localStorage.removeItem('izakaya-sushi');else localStorage.setItem('izakaya-sushi','1')}catch(e){}showHome();tstPanel()}
  else if(act==='tstcoin')tstEdit(o=>{o.coins=(o.coins||0)+(+a.dataset.id)});
  else if(act==='tstdebt')tstEdit(o=>{o.debt=0;o.loans=0;o.dues=[]});
  else if(act==='tstev'){const ev=$('tstev').value,rob=$('tstrob').value,cust=$('tstcust').value,bare=$('tstbare').value?1:0;tstEdit(o=>{o.tforce={ev,rob,cust};if(bare)o.tforce.bare=1;if(!ev&&!rob&&!cust&&!bare)delete o.tforce;o.today=null})}
  else if(act==='tstspd'){TSPD=+a.dataset.id;tstPanel()}
  else if(act==='tstrm')tstEdit(o=>{o.owned=true;if(!o.rm)o.rm={up:{},dec:{},seen:false};o.where='rm'});
  else if(act==='tstk2')tstEdit(o=>{if(!o.rm||o.rm.k2)return;o.rm.k2=1;o.menu=o.menu||{};o.menu.koro=true;o.fresh=(o.fresh||[]).concat('koro')});
  else if(act==='tstfried')tstEdit(o=>{if(o.rm)o.rm.fried=(o.rm.fried||0)+50});
  else if(act==='tstreset'){if(!TEST)return;lsSet(TKEY,null);lsSet(TRKEY,null);const r=loadRec();r.tut=true;saveRec(r);showHome();tstPanel()}
});

function showAcct(){const u=CL.user;if(!u)return;
  const st=CL.status==='err'?T('同步失敗，稍後會再試'):CL.status==='sync'?T('同步中…'):T('已同步');
  modal(`<h2>${T('帳號')}</h2><div class="acctcard">${u.photo?`<img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">`:''}<div><b>${esc(u.name)}</b><p style="font-size:14px;margin:2px 0 0">${st}</p></div></div>
  <p style="font-size:14px">${T('存檔會自動同步到雲端，換手機或電腦登入同一個帳號就能接著玩。')}</p>
  <div class="btns"><button class="btn" data-act="closem">${T('返回')}</button><button class="btn alt" data-act="syncnow">${T('立即同步')}</button><button class="btn alt" data-act="logout">${T('登出')}</button></div>`)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&CL.timer)cloudUpload(true)});window.addEventListener('pagehide',()=>{if(CL.timer)cloudUpload(true)});
cloudInit();
/* ===== new-version notice: compare the CACHE name in sw.js now vs when this page loaded ===== */
let VER0=null,NEWVER=false;
function updBar(){return `<button class="updbar" id="updbar" data-act="update">⟳ ${T('有新版本，點這裡更新')}</button>`}
async function verCheck(){if(NEWVER||!navigator.onLine)return;
  try{const r=await fetch('sw.js',{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/CACHE\s*=\s*'([^']+)'/);if(!m)return;
    if(VER0==null){VER0=m[1];return}
    if(m[1]!==VER0)showUpd()}catch(e){}}
/* tapping "update": make the new service worker install (it downloads the new page into its cache) and take over
   BEFORE reloading. Reloading right away let the old worker answer from its cache, so the player got the old version
   back (and the banner went away), and on iPhone home-screen apps the reload could hang on a black screen. */
let UPDATING=false;
async function doUpdate(){if(UPDATING)return;UPDATING=true;const b=$('updbar');if(b){b.disabled=true;b.textContent='⟳ '+T('更新中，請稍等…')}
  try{const sw=navigator.serviceWorker,r=sw&&await sw.getRegistration();
    if(r){const ready=new Promise(ok=>{sw.addEventListener('controllerchange',ok,{once:true})});
      await Promise.race([r.update().then(()=>{if(!r.installing&&!r.waiting)return;if(r.waiting)r.waiting.postMessage({type:'skip'});return ready}),new Promise(ok=>setTimeout(ok,15000))])}}catch(e){}
  location.reload()}
function showUpd(){NEWVER=true;const h=document.querySelector('.home');if(HOME&&h&&!$('updbar'))h.insertAdjacentHTML('beforeend',updBar())}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='newver')showUpd()});
verCheck();setInterval(verCheck,10*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verCheck()});
applyLang();chooseLayout(true);fit();showHome();requestAnimationFrame(loop);
/* art is in separate files now: keep the loading screen up until the title art has arrived (at most 5s), then fetch
   every character sprite in the background so customers never walk in as blank boxes */
{const b=document.getElementById('boot');if(b){const im=[...document.querySelectorAll('.homeimg,.logo img')];
  Promise.race([Promise.all(im.map(i=>i.complete?0:new Promise(r=>{i.addEventListener('load',r,{once:true});i.addEventListener('error',r,{once:true})}))),new Promise(r=>setTimeout(r,5000))]).then(()=>b.remove())}}
setTimeout(()=>{for(const u of new Set(JSON.stringify([SPR,ROBSPR]).match(/img\/[\w-]+\.webp/g)||[])){const i=new Image();i.decoding='async';i.src=u}},600);
</script>

<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));</script>
