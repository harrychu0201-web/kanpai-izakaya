name: Export feedback

# Reads the latest player feedback (fb node only) and pushes it to the PRIVATE
# repo harrychu0201-web/kanpai-feedback-inbox. This repo is public, so the data
# must never be committed here.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedback-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Export feedback to private inbox
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FEEDBACK_PAT: ${{ secrets.FEEDBACK_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SA" ]; then
            echo "FIREBASE_SA secret is missing" >&2
            exit 1
          fi
          if [ -z "$FEEDBACK_PAT" ]; then
            echo "FEEDBACK_PAT secret is missing" >&2
            exit 1
          fi
          WORK="$RUNNER_TEMP/fbexport"
          mkdir -p "$WORK" && cd "$WORK"
          npm init -y >/dev/null
          npm install --silent firebase-admin@12
          printf '%s' "$FIREBASE_SA" > sa.json
          cat > export.mjs <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { initializeApp, cert } from 'firebase-admin/app';
          import { getDatabase } from 'firebase-admin/database';
          let sa;
          try { sa = JSON.parse(readFileSync('sa.json', 'utf8')); } catch (e) { console.error('FIREBASE_SA is not valid JSON:', e.name); process.exit(1); }
          initializeApp({
            credential: cert(sa),
            databaseURL: 'https://kanpai-izakaya-default-rtdb.firebaseio.com',
          });
          const snap = await getDatabase().ref('fb').orderByChild('t').limitToLast(1000).once('value');
          const items = [];
          snap.forEach(c => { items.push({ id: c.key, ...c.val() }); });
          items.reverse();
          writeFileSync('feedback.json', JSON.stringify({ exportedAt: new Date().toISOString(), count: items.length, items }, null, 2) + '\n');
          console.log('exported', items.length, 'items');
          process.exit(0);
          JS
          node export.mjs
          rm -f sa.json

          # Push to the private inbox repo (token only in env, never echoed)
          git clone -q --depth 1 "https://x-access-token:${FEEDBACK_PAT}@github.com/harrychu0201-web/kanpai-feedback-inbox.git" inbox 2>/dev/null || { git init -q inbox && git -C inbox remote add origin "https://x-access-token:${FEEDBACK_PAT}@github.com/harrychu0201-web/kanpai-feedback-inbox.git"; }
          cp feedback.json inbox/feedback.json
          cd inbox
          git config user.name "feedback-export"
          git config user.email "feedback-export@users.noreply.github.com"
          git checkout -q -B main
          git add feedback.json
          if git diff --cached --quiet; then
            echo "no change since last export"
          else
            git commit -q -m "feedback export $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -q origin main
            echo "pushed to inbox"
          fi
