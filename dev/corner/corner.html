<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<title>街角試作｜乾杯！居酒屋</title>
<style>
html,body{margin:0;height:100%;background:#e7edf0;overflow:hidden;font-family:"Hiragino Sans","Noto Sans TC",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0}
#cv{width:100%;height:100%;display:block}
.cbar{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;z-index:3}
.cbar button,.cback{min-height:48px;min-width:48px;border:3px solid #2a1810;border-radius:16px;background:#fff6e0;color:#3a1e0c;font-weight:900;font-size:17px;padding:0 14px;box-shadow:0 4px 0 #0006;cursor:pointer}
.cbar button.on{background:#ffd27a}
.cback{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:3;display:flex;align-items:center;text-decoration:none}
.ctag{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);background:#0007;color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;z-index:2;white-space:nowrap;pointer-events:none}
.cjoy{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:#ffffff44;border:3px solid #ffffffaa;z-index:3;touch-action:none;box-shadow:0 4px 14px #0003}
.cjoy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff6e0;border:3px solid #2a1810;box-shadow:0 3px 0 #0005}
#rot{display:none;position:fixed;inset:0;background:#2a1810;color:#fff6e0;z-index:9;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:800;line-height:1.6}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;font-size:18px;color:#3a1e0c;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <a class="cback" href="../../index.html">← 回遊戲</a>
  <div class="ctag">街角試作・程式畫的佔位版</div>
  <div class="cbar"><button data-t="day" class="on">☀️ 白天</button><button data-t="eve">🌇 傍晚</button><button data-t="night">🌙 夜晚</button></div>
</div>
<div id="rot">📱 請把手機轉成橫向</div>
<div id="err">這台裝置無法顯示 3D 畫面（需要支援 WebGL 的瀏覽器）</div>
<script src="corner-1a52a8fa.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search),C=null;
  try{C=Corner.start(document.getElementById('cv'),{root:document.getElementById('wrap'),test:q.has('test'),time:q.get('t')||'day'})}catch(e){console.error(e);document.getElementById('err').style.display='flex';return}
  window.CORNER=C;
  document.querySelectorAll('.cbar button').forEach(function(b){
    if(b.dataset.t===C.time)b.classList.add('on');else b.classList.remove('on');
    b.addEventListener('click',function(){C.setTime(b.dataset.t);document.querySelectorAll('.cbar button').forEach(function(x){x.classList.toggle('on',x===b)})})});
})();
</script>
</body>
</html>
